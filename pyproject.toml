[project]
name = "tricorder"
version = "0.1.0"
description = "Tricorder: iPhone video -> COLMAP/OpenMVS -> metric 3D model of an environment -> dimensioned site plan"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "open3d>=0.19",
    "pycolmap>=3.11",          # measure_project.py, 12_identify.py: undistortion with the scan's camera model
    "ezdxf>=1.3",              # 08_site_plan.py: the DXF drawing
    "matplotlib>=3.8",         # 08_site_plan.py: the PDF sheet
    "contourpy>=1.2",          # 08_site_plan.py: contour lines from the DEM
    "shapely>=2.0",            # 10_trace_walls.py: polygons
    "geopandas>=1.0",          # 10_trace_walls.py: buildingregulariser works on GeoDataFrames
    "buildingregulariser>=0.2",# 10_trace_walls.py: orthogonalise enclosures
    "scikit-image>=0.22",      # 09_trace_lines.py: skeletonise, Hough
    "scikit-learn>=1.4",       # 11_detect_stairs.py, 12_identify.py: DBSCAN
    "pillow>=10",
]

[project.optional-dependencies]
identify = [                   # scripts/12_identify.py: Grounding DINO + SAM lifted onto the model (prototype)
    "torch>=2.4",
    "transformers>=4.45",
]

[tool.setuptools]
packages = ["tricorder"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

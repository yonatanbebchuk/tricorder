<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backyard Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf9f5; --card:#f4f3eb; --card2:#fffefb; --ink:#191918; --muted:#66655c; --faint:#8a8880; --line:#e4e2d8; --line2:#b0aea5;
          --accent:#d97757; --accent-ink:#382110; --ok:#4f7f5a; --bad:#b9452c; --run:#d97757; --skip:#b0aea5;
          --serif:"Newsreader", Georgia, serif; --sans:Inter, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
          --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  header { padding:20px 40px; display:flex; align-items:baseline; justify-content:space-between; gap:14px; border-bottom:1px solid var(--line); }
  header h1 { font:500 20px/1 var(--serif); letter-spacing:-.02em; margin:0; } header h1 a { text-decoration:none; color:inherit; }
  header nav a { margin-left:18px; font-size:14px; color:var(--muted); text-decoration:none; } header nav a:hover { color:var(--accent); }
  header span.health { color:var(--faint); font-size:12px; font-family:var(--mono); margin-left:18px; }
  main { padding:26px 40px 70px; max-width:1500px; }
  @media (max-width:900px) { header, main { padding-left:18px; padding-right:18px; } }
  h2.page { font:500 32px/1.15 var(--serif); letter-spacing:-.02em; margin:0 0 6px; } h2.page em { color:var(--accent); font-style:italic; }
  p.lead { color:var(--muted); margin:0 0 22px; max-width:70ch; }
  .crumbs { font-size:13px; color:var(--muted); margin-bottom:14px; } .crumbs a { color:var(--muted); } .crumbs a:hover { color:var(--accent); }
  .card { background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:18px 20px; margin-bottom:18px; }
  .card h3 { font:500 18px/1.2 var(--serif); margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select, button, textarea { font:inherit; color:inherit; }
  input[type=text], input[type=number], select, textarea { width:100%; padding:7px 9px; border:1px solid var(--line2); border-radius:4px; background:var(--bg); }
  textarea { min-height:70px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset:1px; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  button { padding:8px 14px; border-radius:4px; border:1px solid var(--line2); background:transparent; cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--ink); } button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  button.primary:hover { background:var(--accent); border-color:var(--accent); } button:disabled { opacity:.5; cursor:default; }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  .drop { border:1px dashed var(--line2); border-radius:4px; padding:18px; text-align:center; color:var(--muted); cursor:pointer; background:var(--card); }
  .drop:hover, .drop.over { border-color:var(--accent); color:var(--accent-ink); }
  progress { width:100%; height:6px; accent-color:var(--accent); }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; color:var(--bg); white-space:nowrap; font-family:var(--mono); letter-spacing:.02em; background:var(--skip); }
  .pill.done{background:var(--ok)} .pill.running{background:var(--run)} .pill.failed,.pill.cancelled{background:var(--bad)}
  .pill.pending{opacity:.55} .pill.interrupted,.pill.queued{background:var(--skip)}
  .dots { display:inline-flex; gap:3px; vertical-align:middle; } .dots i { width:8px; height:8px; border-radius:50%; background:var(--line); display:inline-block; }
  .dots i.done{background:var(--ok)} .dots i.running{background:var(--run); animation:pulse 1s infinite} .dots i.failed,.dots i.cancelled,.dots i.interrupted{background:var(--bad)}
  @keyframes pulse { 50% { opacity:.3 } }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; }
  .scan { background:var(--card2); border:1px solid var(--line); border-radius:6px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; }
  .scan:hover { border-color:var(--accent); } .scan .thumb { aspect-ratio:16/9; background:var(--card); object-fit:cover; width:100%; display:block; }
  .scan .thumb.empty { display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:13px; }
  .scan .body { padding:12px 14px; } .scan .body b { font:500 17px/1.2 var(--serif); display:block; }
  .scan .meta { color:var(--muted); font-size:12.5px; margin-top:3px; } .scan .runs { margin-top:8px; font-size:12.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .toolbar { display:flex; gap:10px; align-items:center; margin:8px 0; flex-wrap:wrap; } .toolbar .grow { flex:1; }
  table.runs { width:100%; border-collapse:collapse; font-size:13.5px; } table.runs th { text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.runs td { padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; } table.runs tr.link { cursor:pointer; } table.runs tr.link:hover { background:var(--card); }
  td.mono, .mono { font-family:var(--mono); font-size:12px; }
  .stages { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin:14px 0; }
  .stage { border:1px solid var(--line); background:var(--card); border-radius:4px; padding:10px 12px; cursor:pointer; } .stage:hover { border-color:var(--line2); }
  .stage.sel { border-color:var(--accent); background:var(--card2); } .stage b { display:block; font:500 14px/1.3 var(--serif); }
  .stage small { color:var(--muted); display:block; font-size:12px; } .stage .err { color:var(--bad); font-size:12px; }
  pre.log { background:#191918; color:#e9e6dc; border-radius:4px; padding:14px; height:380px; overflow:auto; font:12px/1.5 var(--mono); white-space:pre-wrap; word-break:break-all; margin:0; }
  .warn { background:color-mix(in srgb, var(--accent) 10%, var(--bg)); border-left:3px solid var(--accent); border-radius:2px; padding:9px 12px; margin:8px 0; font-size:13.5px; color:var(--accent-ink); }
  .metrics { display:flex; gap:22px; flex-wrap:wrap; margin:4px 0 8px; } .metrics div b { display:block; font:500 22px/1.1 var(--serif); } .metrics div span { color:var(--muted); font-size:12px; }
  table.files { width:100%; border-collapse:collapse; } table.files td { padding:7px 4px; border-top:1px solid var(--line); vertical-align:middle; } td.sz { color:var(--faint); white-space:nowrap; text-align:right; font-family:var(--mono); font-size:12px; }
  a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--line2); text-underline-offset:3px; } a:hover { color:var(--accent); text-decoration-color:var(--accent); }
  img.preview { max-width:100%; border:1px solid var(--line); border-radius:4px; margin-top:12px; background:#fff; }
  .muted { color:var(--muted); } code { font-family:var(--mono); font-size:12.5px; background:var(--card); padding:1px 5px; border-radius:3px; }
  .two { display:grid; grid-template-columns:340px 1fr; gap:22px; } @media (max-width:900px) { .two { grid-template-columns:1fr; } }
  .prompt { border:1px solid var(--line); border-radius:4px; padding:12px 14px; margin:10px 0; background:var(--card); }
  .prompt .ptitle { font:500 15px/1.3 var(--serif); margin-bottom:6px; } .prompt .ptitle .k { color:var(--accent); font-style:italic; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .pair figure, .trio figure { margin:0; } .trio { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  figure .imgs { display:flex; gap:6px; } figure .imgs img { height:190px; border-radius:3px; border:1px solid var(--line); object-fit:cover; } figure figcaption { font-size:12px; color:var(--muted); margin-top:4px; }
  .prompt .ans { display:flex; gap:8px; align-items:center; margin-top:10px; } .prompt .ans input[type=number] { width:140px; }
  .prompt.answered { border-color:var(--ok); } .prompt.skipped { opacity:.55; }
  .resid td { font-family:var(--mono); font-size:12px; } .resid .bad { color:var(--bad); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><h1><a href="#/">Backyard Scanner</a></h1><div><nav><a href="#/">Scans</a><a href="#/new">New scan</a></nav><span class="health" id="health"></span></div></header>
<main id="main"></main>
<script>
const $ = s => document.querySelector(s);
const fmtSize = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB' : b > 1e6 ? (b/1e6).toFixed(1)+' MB' : b > 1e3 ? (b/1e3).toFixed(0)+' KB' : b+' B';
const fmtDur = s => s == null ? '' : s < 90 ? Math.round(s)+' s' : s < 5400 ? Math.round(s/60)+' min' : (s/3600).toFixed(1)+' h';
const fmtWhen = t => t ? t.replace('T', ' ').slice(0, 16) : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAGES = ['frames', 'sfm', 'dense', 'landmarks', 'plan'];
const LABEL = { frames:'1 · Frames', sfm:'2 · COLMAP', dense:'3 · OpenMVS', landmarks:'4 · Landmarks', plan:'5 · Plan' };
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

// ------------------------------------------------------------ router
let timer = null, view = null;
function route() {
  clearInterval(timer); timer = null;
  const h = location.hash.replace(/^#\/?/, '');
  const m = h.match(/^scan\/([^/]+)(?:\/run\/([^/]+))?$/);
  if (h === 'new') view = () => pageNew();
  else if (m && m[2]) view = () => pageRun(m[1], m[2]);
  else if (m) view = () => pageScan(m[1]);
  else view = () => pageScans();
  view();
}
window.addEventListener('hashchange', route);
function poll(fn, ms) { clearInterval(timer); timer = setInterval(fn, ms || 3000); }

// ------------------------------------------------------------ helpers
function stageMetrics(name, m, scan) {
  if (!m) return '';
  const p = [];
  if (name === 'frames') { if (m.images != null) p.push(`${m.images} frames`); if (m.sharpness_median != null) p.push(`sharpness ${Math.round(m.sharpness_median)}`); }
  if (name === 'sfm') { if (m.registered != null) p.push(`${m.registered}${m.images ? ' / ' + m.images : ''} registered`); if (m.submodels) p.push(`${m.submodels} model${m.submodels > 1 ? 's' : ''}`); if (m.reproj_px) p.push(`${m.reproj_px.toFixed(2)} px`); }
  if (name === 'dense') { if (m.dense_points) p.push(`${(m.dense_points/1e6).toFixed(1)}M pts`); if (m.faces) p.push(`${(m.faces/1e6).toFixed(1)}M faces`); }
  if (name === 'landmarks') { if (m.prompts != null) p.push(`${m.prompts} prompts`); if (m.structural) p.push(`${m.structural} structural`); }
  if (name === 'plan') { if (m.scale) p.push(`scale ${m.scale.toFixed(4)}`); if (m.measurements) p.push(`${m.measurements} meas.`); if (m.max_residual_cm != null) p.push(`±${m.max_residual_cm.toFixed(1)} cm`); }
  return p.join(' · ');
}
function warnings(scan, run) {
  const w = [], f = scan.frames.metrics || {}, s = run.stages.sfm.metrics || {};
  if (f.images && s.registered != null && s.registered < 0.6 * f.images)
    w.push(`Only ${s.registered} of ${f.images} frames registered${s.submodels > 1 ? ` and COLMAP split the walk into ${s.submodels} pieces` : ''}. Blank surfaces, blur or fast turns; try the ALIKED + LightGlue run.`);
  if (f.sharpness_median && f.sharpness_median < 80) w.push(`Frames are soft (sharpness median ${Math.round(f.sharpness_median)}; above 150 is comfortable).`);
  for (const [k, st] of Object.entries(run.stages)) if (st.error && st.status !== 'cancelled') w.push(`${LABEL[k]} failed: ${esc(st.error)}. Open its log.`);
  if (run.status === 'cancelled') w.push('Run was cancelled.');
  if (run.status === 'interrupted') w.push('The pipeline process died (Mac slept or was restarted?). Start again; finished stages are kept.');
  return w.map(t => `<div class="warn">${t}</div>`).join('');
}
const settingsLine = s => `${s.features}+${s.matcher === 'LIGHTGLUE' ? 'LightGlue' : 'BF'} · ${s.matching} · dense L${s.res_level} · ${s.measures} meas.`;

// ------------------------------------------------------------ scans page
async function pageScans() {
  const scans = await api('/api/scans');
  $('#main').innerHTML = `
    <h2 class="page">Video in, <em>backyard</em> out.</h2>
    <p class="lead">Each scan is one filmed walk. Runs are pipeline executions on that footage; the frames are shared, everything else is per run.</p>
    <div class="toolbar"><span class="grow muted">${scans.length} scan${scans.length === 1 ? '' : 's'}</span><a href="#/new"><button class="primary">New scan</button></a></div>
    <div class="grid">${scans.map(s => `
      <div class="scan" onclick="location.hash='#/scan/${s.id}'">
        ${s.thumbnail ? `<img class="thumb" src="/api/scans/${s.id}/file/${s.thumbnail}" alt="">` : `<div class="thumb empty">no frames yet</div>`}
        <div class="body"><b>${esc(s.name)}</b>
          <div class="meta">${fmtWhen(s.created_at)}${s.video.duration_s ? ' · ' + fmtDur(s.video.duration_s) : ''}${s.video.width ? ' · ' + s.video.width + '×' + s.video.height : ''}${s.video.hdr && s.video.hdr !== 'none' ? ' · HDR' : ''}</div>
          <div class="runs">${s.runs.length ? s.runs.map(r => `<span><span class="pill ${r.status}">${r.id} ${r.status}</span></span>`).join('') : '<span>no runs</span>'}</div>
        </div></div>`).join('')}
    </div>
    ${!scans.length ? '<p class="muted">No scans yet. Upload a video to start.</p>' : ''}`;
  poll(pageScans, 5000);
}

// ------------------------------------------------------------ new scan page
function settingsForm(prefix, s) {
  s = s || {};
  return `
    <div class="row">
      <div><label>Features</label><select id="${prefix}features"><option value="SIFT" ${s.features !== 'ALIKED' ? 'selected' : ''}>SIFT (fast, ~30 min / 300 frames)</option><option value="ALIKED" ${s.features === 'ALIKED' ? 'selected' : ''}>ALIKED (learned; blank walls)</option></select></div>
      <div><label>Matcher</label><select id="${prefix}matcher"><option value="BRUTEFORCE">brute force</option><option value="LIGHTGLUE" ${s.matcher === 'LIGHTGLUE' ? 'selected' : ''}>LightGlue (learned, hours)</option></select></div>
      <div><label>Pairs</label><select id="${prefix}matching"><option value="vocab">vocab tree</option><option value="sequential" ${s.matching === 'sequential' ? 'selected' : ''}>sequential</option><option value="exhaustive" ${s.matching === 'exhaustive' ? 'selected' : ''}>exhaustive</option></select></div>
    </div>
    <div class="row">
      <div><label>Dense level</label><select id="${prefix}res"><option value="1">1 (half res, slow)</option><option value="2" selected>2 (quarter)</option><option value="3">3 (eighth, fast)</option></select></div>
      <div><label>Measurements to ask for</label><select id="${prefix}measures"><option value="3">3</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option></select></div>
      <div><label>Label (optional)</label><input type="text" id="${prefix}label" placeholder="e.g. learned features"></div>
    </div>`;
}
const readSettings = prefix => ({ features: $(`#${prefix}features`).value, matcher: $(`#${prefix}matcher`).value, matching: $(`#${prefix}matching`).value,
                                   res_level: +$(`#${prefix}res`).value, measures: +$(`#${prefix}measures`).value });
async function pageNew() {
  const vids = await api('/api/videos');
  $('#main').innerHTML = `
    <div class="crumbs"><a href="#/">Scans</a> › New scan</div>
    <h2 class="page">New <em>scan</em></h2>
    <p class="lead">A scan is one video. Frames are extracted once; the first run starts right away.</p>
    <div class="two"><div>
      <div class="card"><h3>Video</h3>
        <div class="drop" id="drop">Drop a video here or click to choose<br><small>.MOV / .mp4 from the iPhone</small></div>
        <input type="file" id="file" accept="video/*,.mov,.MOV,.mp4" hidden>
        <progress id="upprog" value="0" max="100" hidden></progress><div id="upmsg" class="muted" style="font-size:12px"></div>
        <label>Or pick one already in data/</label>
        <select id="video">${vids.map(v => `<option value="${v.name}">${v.name} (${fmtSize(v.size)})${v.used ? ' · already scanned' : ''}</option>`).join('') || '<option value="">no videos in data/</option>'}</select>
        <label>Scan name</label><input type="text" id="name" placeholder="Backyard, noon">
        <div class="row"><div><label>Frames / second</label><input type="number" id="fps" value="2" step="0.5" min="0.5"></div>
          <div><label>Max frames</label><input type="number" id="maxf" value="400" step="50" min="20"></div>
          <div><label>HDR</label><select id="hdr"><option value="auto" selected>auto-detect</option><option value="none">none</option><option value="hlg">HLG</option><option value="pq">PQ</option></select></div></div>
        <p class="muted" style="font-size:12.5px">Rule of thumb: 400 frames for a 3 to 5 minute walk, 600 for 7 minutes. More frames = better coverage, much longer COLMAP.</p>
      </div></div>
      <div><div class="card"><h3>First run</h3>${settingsForm('n_')}
        <div style="margin-top:14px"><button class="primary" id="create">Create scan and start</button> <span id="msg" class="muted"></span></div></div></div>
    </div>`;
  const drop = $('#drop'), fileIn = $('#file');
  drop.onclick = () => fileIn.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
  fileIn.onchange = () => fileIn.files[0] && upload(fileIn.files[0]);
  $('#video').onchange = () => { if (!$('#name').value) $('#name').value = $('#video').value.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '); };
  $('#video').onchange();
  $('#create').onclick = async () => {
    $('#msg').textContent = 'creating…';
    try {
      const r = await post('/api/scans', { video: $('#video').value, name: $('#name').value || undefined, fps: +$('#fps').value, max_frames: +$('#maxf').value,
                                           hdr: $('#hdr').value, settings: { ...readSettings('n_') }, start: true });
      location.hash = `#/scan/${r.scan_id}/run/${r.run_id}`;
    } catch (e) { $('#msg').textContent = e.message; }
  };
}
function upload(file) {
  const fd = new FormData(); fd.append('file', file);
  const xhr = new XMLHttpRequest(); xhr.open('POST', '/api/upload');
  $('#upprog').hidden = false; $('#upmsg').textContent = `uploading ${file.name} (${fmtSize(file.size)})`;
  xhr.upload.onprogress = e => { if (e.lengthComputable) $('#upprog').value = 100 * e.loaded / e.total; };
  xhr.onload = () => {
    $('#upprog').hidden = true;
    if (xhr.status !== 200) { $('#upmsg').textContent = 'upload failed: ' + xhr.responseText; return; }
    const res = JSON.parse(xhr.responseText); const i = res.info || {};
    $('#upmsg').textContent = `saved data/${res.name}${i.duration_s ? ' · ' + fmtDur(i.duration_s) : ''}${i.width ? ' · ' + i.width + '×' + i.height : ''}${i.hdr && i.hdr !== 'none' ? ' · ' + i.hdr.toUpperCase() + ' HDR' : ''}`;
    const sel = $('#video'); const opt = document.createElement('option'); opt.value = res.name; opt.textContent = `${res.name} (${fmtSize(res.size)})`; sel.prepend(opt); sel.value = res.name; sel.onchange();
    if (i.duration_s > 330) $('#maxf').value = 600;
  };
  xhr.onerror = () => { $('#upprog').hidden = true; $('#upmsg').textContent = 'upload failed'; };
  xhr.send(fd);
}

// ------------------------------------------------------------ scan page
async function pageScan(sid) {
  let s; try { s = await api('/api/scans/' + sid); } catch (e) { $('#main').innerHTML = `<div class="card muted">${e.message}</div>`; return; }
  const f = s.frames.metrics || {};
  $('#main').innerHTML = `
    <div class="crumbs"><a href="#/">Scans</a> › ${esc(s.name)}</div>
    <div class="two"><div>
      ${s.thumbnail ? `<img class="preview" style="margin:0 0 14px" src="/api/scans/${s.id}/file/${s.thumbnail}">` : ''}
      <div class="card"><h3 style="display:flex;justify-content:space-between;align-items:baseline">${esc(s.name)} <button id="rename" style="font-size:12px;padding:3px 8px">rename</button></h3>
        <div class="muted" style="font-size:13px">${esc(s.video.path.split('/').pop())}<br>${s.video.duration_s ? fmtDur(s.video.duration_s) + ' · ' : ''}${s.video.width ? s.video.width + '×' + s.video.height + ' · ' : ''}${s.video.fps ? Math.round(s.video.fps) + ' fps' : ''}${s.video.hdr && s.video.hdr !== 'none' ? ' · ' + s.video.hdr.toUpperCase() + ' HDR' : ''}<br>created ${fmtWhen(s.created_at)}</div>
        <div class="metrics" style="margin-top:12px"><div><b>${f.images ?? '–'}</b><span>frames · <span class="pill ${s.frames.status}">${s.frames.status}</span></span></div>
          <div><b>${f.sharpness_median ? Math.round(f.sharpness_median) : '–'}</b><span>sharpness median</span></div>
          <div><b>${s.frame_settings.fps}</b><span>fps · max ${s.frame_settings.max_frames}</span></div></div>
        <label>Notes</label><textarea id="notes">${esc(s.notes || '')}</textarea>
        <div class="toolbar"><span class="grow"></span><button id="savenotes">Save notes</button><button class="danger" id="delscan">Delete scan</button></div>
      </div></div>
      <div>
      <div class="card"><h3>Runs</h3>
        ${s.runs.length ? `<table class="runs"><tr><th>run</th><th>settings</th><th>status</th><th>COLMAP</th><th>dense</th><th>plan</th><th>created</th></tr>
        ${s.runs.map(r => `<tr class="link" onclick="location.hash='#/scan/${s.id}/run/${r.id}'">
          <td><b>${r.id}</b>${r.label ? `<br><small class="muted">${esc(r.label)}</small>` : ''}</td><td class="mono">${settingsLine(r.settings)}</td>
          <td><span class="pill ${r.status}">${r.status}</span> <span class="dots">${STAGES.slice(1).map(k => `<i class="${r.stages[k].status}"></i>`).join('')}</span></td>
          <td>${stageMetrics('sfm', r.stages.sfm.metrics) || '–'}</td><td>${stageMetrics('dense', r.stages.dense.metrics) || '–'}</td>
          <td>${stageMetrics('plan', r.stages.plan.metrics) || (r.prompts_available ? '<span class="muted">awaiting measurements</span>' : '–')}</td><td class="muted">${fmtWhen(r.created_at)}</td></tr>`).join('')}</table>` : '<p class="muted">No runs yet.</p>'}
      </div>
      <div class="card"><h3>New run on this footage</h3>${settingsForm('r_')}
        <div style="margin-top:14px"><button class="primary" id="newrun">Start run</button> <span id="msg" class="muted"></span></div>
        <p class="muted" style="font-size:12.5px;margin-top:10px">Frames are reused. A second run is how you compare SIFT against ALIKED + LightGlue on the same walk.</p></div>
      </div></div>`;
  $('#savenotes').onclick = async () => { await api('/api/scans/' + sid, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: $('#notes').value }) }); $('#savenotes').textContent = 'saved'; };
  $('#rename').onclick = async () => { const n = prompt('Scan name', s.name); if (n) { await api('/api/scans/' + sid, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: n }) }); pageScan(sid); } };
  $('#delscan').onclick = async () => { if (confirm(`Delete scan "${s.name}" and all its runs? This removes the files on disk.`)) { try { await api('/api/scans/' + sid, { method: 'DELETE' }); location.hash = '#/'; } catch (e) { alert(e.message); } } };
  $('#newrun').onclick = async () => {
    $('#msg').textContent = 'starting…';
    try { const r = await post(`/api/scans/${sid}/runs`, { settings: readSettings('r_'), label: $('#r_label').value, start: true }); location.hash = `#/scan/${sid}/run/${r.run_id}`; }
    catch (e) { $('#msg').textContent = e.message; }
  };
  poll(() => { if (s.runs.some(r => r.status === 'running') || s.frames.status === 'running') pageScan(sid); }, 4000);
}

// ------------------------------------------------------------ run page
let selStage = null, follow = true, lastLog = '', runSig = '';
async function pageRun(sid, rid, force) {
  let r; try { r = await api(`/api/scans/${sid}/runs/${rid}`); } catch (e) { $('#main').innerHTML = `<div class="card muted">${e.message}</div>`; return; }
  const s = r.scan;
  const stages = { frames: s.frames, ...r.stages };
  if (selStage == null) { const cur = STAGES.filter(k => stages[k].status !== 'pending').pop(); selStage = cur || 'frames'; }
  const sig = JSON.stringify([rid, r.status, STAGES.map(k => stages[k].status), r.artifacts.map(a => a.path), r.transform && r.transform.scale, selStage, Object.keys(r.answers).length]);
  if (sig === runSig && !force) { await loadLog(sid, rid); return; }
  runSig = sig;
  const plan = r.artifacts.find(a => a.path === 'plan_grid.png'), preview = r.artifacts.find(a => a.path === 'preview_plan_grid.png');
  const busy = r.status === 'running';
  $('#main').innerHTML = `
    <div class="crumbs"><a href="#/">Scans</a> › <a href="#/scan/${sid}">${esc(s.name)}</a> › ${rid}</div>
    <div class="card">
      <div class="toolbar"><h3 class="grow" style="margin:0">${esc(s.name)} · ${rid} <span class="pill ${r.status}">${r.status}</span>${r.label ? ` <span class="muted" style="font:13px var(--sans)">${esc(r.label)}</span>` : ''}</h3>
        <span class="mono muted">${settingsLine(r.settings)}</span>
        ${busy ? '<button id="cancel">Cancel</button>' : '<button id="restart">Run again</button>'}
        <button id="reveal">Show in Finder</button>${!busy ? '<button class="danger" id="delrun">Delete run</button>' : ''}</div>
      ${warnings(s, r)}
      <div class="stages">${STAGES.map(k => { const st = stages[k]; return `
        <div class="stage ${k === selStage ? 'sel' : ''}" data-k="${k}"><b>${LABEL[k]} <span class="pill ${st.status}">${st.status}</span></b>
          <small>${st.started_at ? fmtWhen(st.started_at).slice(11) : ''}${st.duration_s != null ? ' · ' + fmtDur(st.duration_s) : ''}</small>
          <small>${stageMetrics(k, st.metrics, s)}</small>${st.error && st.status === 'failed' ? `<div class="err">${esc(st.error).slice(0, 80)}</div>` : ''}</div>`; }).join('')}</div>
      <div class="toolbar"><span class="grow muted">Log · ${LABEL[selStage]}</span><label style="margin:0"><input type="checkbox" id="follow" ${follow ? 'checked' : ''}> follow</label></div>
      <pre class="log" id="log"></pre>
    </div>
    ${r.prompts_available ? `<div class="card" id="measure"><h3>Measure</h3><div id="prompts" class="muted">loading prompts…</div></div>` : ''}
    ${r.transform ? `<div class="card"><h3>Scale result</h3>
      <p class="muted">scale ${r.transform.scale.toFixed(4)} m per model unit · level from ${esc(r.transform.ground)} · north: ${esc(r.transform.north)}${r.transform.warning ? ' · <b style="color:var(--bad)">measurements disagree by more than 3%, re-check them</b>' : ''}</p>
      <table class="resid">${(r.transform.residuals || []).map(x => `<tr><td>${x.id} ${x.kind}</td><td>${x.meters.toFixed(2)} m</td><td class="${Math.abs(x.residual_cm) > 5 ? 'bad' : ''}">${x.residual_cm >= 0 ? '+' : ''}${x.residual_cm.toFixed(1)} cm vs mean</td></tr>`).join('')}</table>
      ${plan ? `<img class="preview" src="/api/scans/${sid}/runs/${rid}/file/plan_grid.png?t=${plan.modified}" alt="site plan"><p class="muted">Site plan at true scale (1 m grid). Trace it in QCAD, or open plan.blend.</p>` : ''}
      ${r.plan_versions.length > 1 ? `<p class="muted" style="font-size:12px">${r.plan_versions.length} plan versions; latest ${fmtWhen(r.plan_versions.at(-1).at)}</p>` : ''}</div>` : ''}
    <div class="card"><h3>Outputs</h3>
      ${r.artifacts.length ? `<table class="files">${r.artifacts.map(a => `<tr><td><a href="/api/scans/${sid}/runs/${rid}/file/${a.path}" target="_blank">${a.label}</a><br><small class="muted">${a.path}</small></td><td class="sz">${fmtSize(a.size)}</td></tr>`).join('')}</table>` : '<span class="muted">nothing yet</span>'}
      ${preview && !plan ? `<img class="preview" src="/api/scans/${sid}/runs/${rid}/file/preview_plan_grid.png?t=${preview.modified}" alt="preview plan"><p class="muted">Preview plan: levelled but unscaled. Answer the measurement prompts above for real metres.</p>` : ''}
    </div>`;
  document.querySelectorAll('.stage').forEach(el => el.onclick = () => { selStage = el.dataset.k; lastLog = ''; pageRun(sid, rid, true); });
  $('#follow').onchange = e => follow = e.target.checked;
  $('#reveal').onclick = () => post(`/api/scans/${sid}/runs/${rid}/reveal`);
  const c = $('#cancel'); if (c) c.onclick = async () => { if (confirm('Cancel this run?')) { await post(`/api/scans/${sid}/runs/${rid}/cancel`); pageRun(sid, rid, true); } };
  const rs = $('#restart'); if (rs) rs.onclick = async () => { try { await post(`/api/scans/${sid}/runs/${rid}/start`); selStage = null; pageRun(sid, rid, true); } catch (e) { alert(e.message); } };
  const d = $('#delrun'); if (d) d.onclick = async () => { if (confirm(`Delete run ${rid} and its files?`)) { await api(`/api/scans/${sid}/runs/${rid}`, { method: 'DELETE' }); location.hash = `#/scan/${sid}`; } };
  await loadLog(sid, rid);
  if (r.prompts_available) loadPrompts(sid, rid, r);
  poll(() => pageRun(sid, rid), busy ? 2500 : 6000);
}
async function loadLog(sid, rid) {
  const pre = $('#log'); if (!pre) return;
  const r = await api(`/api/scans/${sid}/runs/${rid}/log?stage=${selStage}`).catch(() => ({ text: '' }));
  const text = (r.truncated ? '… (earlier output trimmed)\n' : '') + (r.text || '(no output yet)');
  if (text !== lastLog) { pre.textContent = text; lastLog = text; if (follow) pre.scrollTop = pre.scrollHeight; }
}

// ------------------------------------------------------------ measure panel
function fig(sid, rid, pt, caption) {
  const u = p => `/api/scans/${sid}/runs/${rid}/file/${p}`;
  return `<figure><div class="imgs"><img class="ctx" src="${u(pt.context)}" title="frame ${pt.frame}"><img src="${u(pt.crop)}" title="zoom"></div><figcaption>${caption}</figcaption></figure>`;
}
async function loadPrompts(sid, rid, r) {
  const box = $('#prompts'); if (!box) return;
  let p; try { p = await api(`/api/scans/${sid}/runs/${rid}/prompts`); } catch (e) { box.textContent = e.message; return; }
  const ans = p.answers || {}, dist = p.prompts.filter(x => x.type === 'distance');
  const shown = []; let extra = 0;
  for (const x of dist) { if (shown.length >= p.count) break; shown.push(x); if (ans[x.id] && ans[x.id].skipped) extra++; }
  for (const x of dist) { if (shown.length >= p.count + extra) break; if (!shown.includes(x)) shown.push(x); }
  const ground = p.prompts.find(x => x.type === 'ground'), north = p.prompts.find(x => x.type === 'north');
  const answered = dist.filter(x => ans[x.id] && ans[x.id].value > 0).length;
  const kindLabel = { diagonal: 'longest span', vertical: 'height', edge: 'span' };
  const busy = r.status === 'running';
  box.className = '';
  box.innerHTML = `
    <p class="muted">Take a tape or laser measure to the site. For each pair find the red and blue points (left: where in the frame; right: zoom), measure the straight-line distance between them and enter it in metres. Long spans matter more than many. Skip anything you can't identify or that has moved; another prompt takes its place.</p>
    ${shown.map((x, i) => `<div class="prompt ${ans[x.id] && ans[x.id].value ? 'answered' : ''} ${ans[x.id] && ans[x.id].skipped ? 'skipped' : ''}" data-id="${x.id}">
      <div class="ptitle">${i + 1} · <span class="k">${kindLabel[x.kind] || x.kind}</span>${x.a.structural && x.b.structural ? ' <span class="muted" style="font:12px var(--sans)">structural corners</span>' : ''} <span class="muted" style="font:12px var(--sans)">(${x.model_dist.toFixed(2)} model units${r.transform ? ' ≈ ' + (x.model_dist * r.transform.scale).toFixed(2) + ' m' : ''})</span></div>
      <div class="pair">${fig(sid, rid, x.a, 'A · red')}${fig(sid, rid, x.b, 'B · blue')}</div>
      <div class="ans"><input type="number" step="0.01" min="0" placeholder="metres" value="${ans[x.id] && ans[x.id].value ? ans[x.id].value : ''}" ${ans[x.id] && ans[x.id].skipped ? 'disabled' : ''}><span class="muted">m</span>
        ${ans[x.id] && ans[x.id].skipped ? '<button class="unskip">Un-skip</button>' : '<button class="skip">Can’t measure this</button>'}</div></div>`).join('')}
    ${ground ? `<div class="prompt ${ans.g1 && ans.g1.confirmed ? 'answered' : ''}" data-id="g1"><div class="ptitle"><span class="k">level</span> · ${ground.text}</div>
      <div class="trio">${ground.points.map((pt, k) => fig(sid, rid, pt, 'ground point ' + (k + 1))).join('')}</div>
      <div class="ans"><button class="gyes ${ans.g1 && ans.g1.confirmed ? 'primary' : ''}">Yes, all on the ground</button><button class="gno ${ans.g1 && ans.g1.confirmed === false ? 'primary' : ''}">No (automatic levelling)</button></div></div>` : ''}
    ${north ? `<div class="prompt ${ans.n1 && ans.n1.bearing != null ? 'answered' : ''}" data-id="n1"><div class="ptitle"><span class="k">north</span> · ${north.text}</div>
      <figure><div class="imgs"><img class="ctx" src="/api/scans/${sid}/runs/${rid}/file/${north.context}"></div><figcaption>frame ${north.frame}</figcaption></figure>
      <div class="ans"><input type="number" step="1" min="0" max="360" placeholder="bearing °" value="${ans.n1 && ans.n1.bearing != null ? ans.n1.bearing : ''}"><span class="muted">degrees, 0 = north, 90 = east</span></div></div>` : ''}
    <div class="toolbar" style="margin-top:14px"><span class="grow muted">${answered} of ${p.count} measurements entered${answered === 0 ? ' · at least one is needed' : ''}</span>
      <button class="primary" id="makeplan" ${answered === 0 || busy ? 'disabled' : ''}>${busy ? 'Working…' : r.transform ? 'Recompute scale & re-render plan' : 'Compute scale & render plan'}</button></div>`;
  const save = (id, body) => post(`/api/scans/${sid}/runs/${rid}/answers`, { prompt_id: id, ...body });
  const refresh = () => pageRun(sid, rid, true);
  box.querySelectorAll('.prompt[data-id^="d"] input').forEach(inp => inp.onchange = async e => { const id = e.target.closest('.prompt').dataset.id, v = parseFloat(e.target.value); await save(id, v > 0 ? { value: v } : {}); refresh(); });
  box.querySelectorAll('.skip').forEach(b => b.onclick = async e => { await save(e.target.closest('.prompt').dataset.id, { skipped: true }); refresh(); });
  box.querySelectorAll('.unskip').forEach(b => b.onclick = async e => { await save(e.target.closest('.prompt').dataset.id, {}); refresh(); });
  const gy = box.querySelector('.gyes'), gn = box.querySelector('.gno');
  if (gy) gy.onclick = async () => { await save('g1', { confirmed: true }); refresh(); };
  if (gn) gn.onclick = async () => { await save('g1', { confirmed: false }); refresh(); };
  const ni = box.querySelector('.prompt[data-id="n1"] input');
  if (ni) ni.onchange = async e => { const v = parseFloat(e.target.value); await save('n1', isNaN(v) ? {} : { bearing: v }); refresh(); };
  const mp = $('#makeplan');
  if (mp) mp.onclick = async () => { mp.disabled = true; mp.textContent = 'Starting…'; try { await post(`/api/scans/${sid}/runs/${rid}/plan`); } catch (e) { alert(e.message); } selStage = 'plan'; refresh(); };
}

(async () => {
  try { const h = await api('/api/health'); $('#health').textContent = `colmap ${h.colmap ? '✓' : '✗'} · openmvs ${h.openmvs ? '✓' : '✗'} · blender ${h.blender ? '✓' : '✗'}`; } catch {}
  route();
})();
</script>
</body>
</html>
